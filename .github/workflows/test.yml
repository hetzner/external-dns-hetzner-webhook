name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: e2e k8s-${{ matrix.k8s }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    strategy:
      fail-fast: false # Continue tests matrix if a flaky run occurs.
      matrix:
        k8s:
          - 1.33
          - 1.34
          - 1.35

    env:
      KUBERNETES_VERSION: ${{ matrix.k8s }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Install test tools
        env:
          CRANE_VERSION: v0.21.9 # renovate: datasource=github-releases depName=google/go-containerregistry
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          go install github.com/google/go-containerregistry/cmd/crane@$CRANE_VERSION

      - uses: hetznercloud/tps-action@5bfcef547f41c44aa626d0474c0491a1dbda792a # main

      - name: Run tests
        run: make test-coverage

      - name: upload coverage reports to codecov
        if: >
          !startswith(github.head_ref, 'renovate/') &&
          !startswith(github.head_ref, 'releaser-pleaser--')
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.codecov_token }}
